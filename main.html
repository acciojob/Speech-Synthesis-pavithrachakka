<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speech Synthesis</title>
  <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="voiceinator">

      <h1>The Voiceinator 5000</h1>

      <select name="voice" id="voices">
        <option value="">Select A Voice</option>
      </select>

      <label for="rate">Rate:</label>
      <input name="rate" type="range" min="0" max="3" value="1" step="0.1">

      <label for="pitch">Pitch:</label>

      <input name="pitch" type="range" min="0" max="2" step="0.1">
      <textarea name="text">Hello! I love JavaScript 👍</textarea>
      <button id="stop">Stop!</button>
      <button id="speak">Speak</button>

    </div>

<script>
  const msg = new SpeechSynthesisUtterance();
  let voices = [];
  const voicesDropdown = document.querySelector('[name="voice"]');
  const options = document.querySelectorAll('[type="range"], [name="text"]');
  const speakButton = document.querySelector('#speak');
  const stopButton = document.querySelector('#stop');

  //Your code goes here
const rate = document.getElementById('rate');
const pitch = document.getElementById('pitch');
const text = document.getElementById('text');

msg.text = text.value;

function getVoices(){
  voices = speechSynthesis.getVoices();
  voiceSelect.innerHTML = voices.map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`).join('');
}
speechSynthesis.addEventListener('voiceschanged', getVoices);
getVoices();

voiceSelect.addEventListener('change', function(){
  msg.voice = voices.find(v => v.name === this.value);
  if(speechSynthesis.speaking){ speechSynthesis.cancel(); speechSynthesis.speak(msg); }
});

rate.addEventListener('input', () => msg.rate = rate.value);
pitch.addEventListener('input', () => msg.pitch = pitch.value);

speakBtn.addEventListener('click', () => {
  if(!text.value.trim()) return;
  speechSynthesis.cancel();
  msg.text = text.value;
  speechSynthesis.speak(msg);
});
stopBtn.addEventListener('click', () => speechSynthesis.cancel());
</script>

</body>
</html>
